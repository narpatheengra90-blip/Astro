<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narpat Astro - Aapka AI Jyotish</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap');

        :root {
            --bg-dark: #0b0719;
            --bg-card: #16102e;
            --gold: #f5b942;
            --gold-hover: #ffcf6b;
            --text-light: #f3f0ff;
            --text-muted: #a69ec4;
            --user-msg: #2c2059;
            --bot-msg: #1e163d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #1d1440 0%, var(--bg-dark) 100%);
            color: var(--text-light);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .chat-container {
            width: 100%;
            max-width: 550px;
            height: 90vh;
            background: var(--bg-card);
            border: 1px solid rgba(245, 185, 66, 0.3);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(245, 185, 66, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(90deg, #130c29, #24174d, #130c29);
            padding: 18px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(245, 185, 66, 0.25);
            position: relative;
        }

        .header h1 {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            font-size: 1.6rem;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 10px rgba(245, 185, 66, 0.3);
        }

        .header p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .reset-btn {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(245, 185, 66, 0.15);
            color: var(--gold);
            border: 1px solid rgba(245, 185, 66, 0.4);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .reset-btn:hover {
            background: var(--gold);
            color: var(--bg-dark);
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        .chat-box::-webkit-scrollbar {
            width: 6px;
        }

        .chat-box::-webkit-scrollbar-thumb {
            background: rgba(245, 185, 66, 0.3);
            border-radius: 10px;
        }

        .message {
            max-width: 82%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.92rem;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bot-message {
            background: var(--bot-msg);
            border: 1px solid rgba(245, 185, 66, 0.2);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            color: var(--text-light);
        }

        .bot-name {
            font-size: 0.72rem;
            color: var(--gold);
            font-weight: 600;
            margin-bottom: 4px;
            display: block;
        }

        .user-message {
            background: var(--user-msg);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .typing {
            font-style: italic;
            color: var(--gold);
            font-size: 0.85rem;
            align-self: flex-start;
            padding: 5px 10px;
            display: none;
        }

        .input-area {
            display: flex;
            padding: 15px;
            background: #110b24;
            border-top: 1px solid rgba(245, 185, 66, 0.2);
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 25px;
            border: 1px solid rgba(245, 185, 66, 0.3);
            background: #1b1338;
            color: var(--text-light);
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(245, 185, 66, 0.2);
        }

        button#send-btn {
            background: var(--gold);
            color: var(--bg-dark);
            border: none;
            padding: 0 22px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.3s;
        }

        button#send-btn:hover {
            background: var(--gold-hover);
            transform: scale(1.03);
        }

        button#send-btn:disabled {
            background: #554c75;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <h1>✨ NARPAT ASTRO ✨</h1>
        <p>Vedic Jyotish & Bhavishya Darshan</p>
        <button class="reset-btn" onclick="resetChat()" title="Nayi Kundli Shuru Karein">Naya Sawal</button>
    </div>

    <div class="chat-box" id="chat-box"></div>
    <div class="typing" id="typing-indicator">🔮 Narpat ji aapke grahon ki ganana kar rahe hain...</div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Yahan apna jawab ya sawal likhein..." autocomplete="off" onkeypress="handleKeyPress(event)">
        <button id="send-btn" onclick="sendMessage()">Bhejein</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const typingIndicator = document.getElementById('typing-indicator');

    // Narpat Astro ka Roleplay aur Rules
    const SYSTEM_PROMPT = `
    Tumhara naam "Narpat Astro" hai. Tum ek bahut hi anubhavi, gyani aur polite Indian Vedic Astrologer (Jyotishacharya) ho.
    
    TUMHARE STRICT RULES:
    1. Language: User jis bhasha mein baat kare (Hinglish, Hindi ya English), usi bhasha mein natural aur warm tareeke se jawab do. Default Hinglish rakho.
    2. Step-by-Step Jaankari Lena: Bina poori jaankari liye kabhi bhi bhavishya mat batana! Sabse pehle user se pyar se unka:
       - Poora Naam (Full Name)
       - Janam Tareekh (Date of Birth)
       - Janam ka Samay (Time of Birth - agar pata ho)
       - Janam ka Shehar (Place of Birth)
       - Aur unka mukhya sawal (Career, Shadi, Paisa, Health, etc.) pucho.
    3. Ek saath bahut saare sawal mat pucho. Agar user ne kuch details de di hain, toh jo bachi hui details hain sirf wahi pucho.
    4. Bhavishya Batana: Jab user apni saari details (Naam, DOB, Place, aur Sawal) bata de, tab ek asli jyotish ki tarah unki rashi, grahon ki dasha aur nakshatron ka zikr karte hue unka bhavishya vistaar (detail) se batao.
    5. Upay (Remedies): Bhavishya batane ke saath-saath hamesha 1 ya 2 saral, positive aur achhe Indian jyotish upay (jaise Surya ko jal dena, Hanuman Chalisa, ya daan karna) zaroor batao.
    6. Tone: Kabhi bhi kisi ko darana nahi hai. Hamesha positive, aashawadi aur margdarshak (guiding) raho. Kabhi mat bolna ki tum ek AI ho, hamesha Narpat Astro ke kirdar mein raho.
    `;

    let conversationHistory = [];

    // Page load hote hi Narpat ji ka pehla message
    window.onload = () => {
        initChat();
    };

    function initChat() {
        conversationHistory = [
            { role: "system", content: SYSTEM_PROMPT }
        ];
        chatBox.innerHTML = "";
        const welcomeMsg = "Pranam! Main Narpat Astro hoon. ✨ Grahon aur nakshatron ki chaal aapke jeevan ke har raaz khol sakti hai.\n\nAapka bhavishya dekhne ke liye kripya apna **Naam**, **Janam Tareekh (DOB)**, **Janam ka Samay** aur **Shehar** batayein. Saath hi yeh bhi batayein ki aap kis vishay (Career, Shadi, Paisa ya Parivar) ke baare mein jaanna chahte hain?";
        appendMessage(welcomeMsg, 'bot');
        conversationHistory.push({ role: "assistant", content: welcomeMsg });
    }

    function resetChat() {
        initChat();
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }

    function appendMessage(text, sender) {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message', sender === 'user' ? 'user-message' : 'bot-message');
        
        // Basic formatting for bold text (**text**) and line breaks
        let formattedText = text
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\n/g, '<br>');

        if (sender === 'bot') {
            msgDiv.innerHTML = `<span class="bot-name">🔮 Narpat Astro</span>${formattedText}`;
        } else {
            msgDiv.innerHTML = formattedText;
        }

        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        // User message screen par dikhayein
        appendMessage(text, 'user');
        userInput.value = '';
        userInput.disabled = true;
        sendBtn.disabled = true;
        typingIndicator.style.display = 'block';
        chatBox.scrollTop = chatBox.scrollHeight;

        conversationHistory.push({ role: "user", content: text });

        try {
            // Free Open-Source AI Endpoint (No API Key Required)
            const response = await fetch('https://text.pollinations.ai/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    messages: conversationHistory,
                    model: 'openai', // Open-source/free routing model
                    seed: Math.floor(Math.random() * 1000)
                })
            });

            if (!response.ok) {
                throw new Error('Network response was not ok');
            }

            const replyText = await response.text();
            
            typingIndicator.style.display = 'none';
            appendMessage(replyText, 'bot');
            conversationHistory.push({ role: "assistant", content: replyText });

        } catch (error) {
            console.error('Error:', error);
            typingIndicator.style.display = 'none';
            appendMessage("Kshama chahta hoon, abhi nakshatron se sampark toot gaya hai (Internet ya server issue). Kripya thodi der baad dobara prayaas karein.", 'bot');
        } finally {
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.focus();
        }
    }
</script>

</body>
</html>
